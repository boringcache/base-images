name: Immich Base Images Seeded No-Layer Ablation
run-name: Seeded ccache + mounts, no layer reuse | seed 31700820652 | ${{ github.ref_name }}

on:
  push:
    branches: [agent/base-images-cache-benchmark]
    paths:
      - .github/workflows/boringcache-base-images-no-layer.yml
  workflow_dispatch:

concurrency:
  group: immich-base-images-no-layer-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
  BORINGCACHE_NO_GIT: "true"
  REBUILD_SOURCE_SHA: 9163399e7675da7e9087171a4ff2a49f815acc27
  SEEDED_CACHE_RUN_ID: "31700820652"
  SEEDED_CACHE_REPETITION: "1"

jobs:
  validate:
    name: Verify no-layer benchmark contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout fork benchmark branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 ./scripts/verify-benchmark-contract.py

  rebuild:
    name: No layers + ccache + mounts | ${{ matrix.image_target }} | ${{ matrix.architecture.name }}
    needs: validate
    runs-on: ${{ matrix.architecture.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        architecture:
          - {name: amd64, platform: linux/amd64, runner: ubuntu-latest}
          - {name: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm}
        image_target: [dev, prod]
    steps:
      - name: Checkout fork benchmark branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/base-images-cache-benchmark
        with:
          strategy: boringcache-no-layers
          phase: rebuild
          source-sha: ${{ env.REBUILD_SOURCE_SHA }}
          architecture: ${{ matrix.architecture.name }}
          platform: ${{ matrix.architecture.platform }}
          target: ${{ matrix.image_target }}
          repetition: "1"
          cache-source-run-id: ${{ env.SEEDED_CACHE_RUN_ID }}
          cache-source-repetition: ${{ env.SEEDED_CACHE_REPETITION }}

  report:
    name: No-layer ablation report
    if: ${{ always() && needs.rebuild.result != 'cancelled' }}
    needs: rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fork benchmark branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Download phase evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: phase-r1-boringcache-no-layers-*
          path: phase-evidence
      - name: Summarize no-layer ablation
        run: >-
          python3 ./scripts/base-images-benchmark-report.py summarize-no-layers
          --input-dir phase-evidence
      - name: Upload no-layer comparison
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.2.0
        with:
          name: immich-base-images-no-layer-comparison
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
