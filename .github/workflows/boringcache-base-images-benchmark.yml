name: Immich Base Images Cache Benchmark
run-name: Native base images | upstream Node-base transition | ${{ github.ref_name }}

on:
  push:
    branches: [agent/base-images-cache-benchmark]
    paths-ignore:
      - .github/workflows/boringcache-base-images-no-layer.yml
  workflow_dispatch:

concurrency:
  group: immich-base-images-benchmark-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  packages: write

env:
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
  BORINGCACHE_NO_GIT: "true"
  SEED_SOURCE_SHA: a645c0ebfe59d53112d8773dca7936b5f90c684d
  REBUILD_SOURCE_SHA: 9163399e7675da7e9087171a4ff2a49f815acc27

jobs:
  validate:
    name: Verify benchmark contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout fork benchmark branch with upstream history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 ./scripts/verify-benchmark-contract.py

  seed:
    name: Seed trial ${{ matrix.repeat }} | ${{ matrix.lane.label }} | ${{ matrix.image_target }} | ${{ matrix.architecture.name }}
    needs: validate
    runs-on: ${{ matrix.architecture.runner }}
    timeout-minutes: 180
    strategy: &benchmark-matrix
      fail-fast: false
      # Match the successful single-trial fan-out. Running all three trials at
      # once can overwhelm upstream source hosts and adds avoidable contention.
      max-parallel: 12
      matrix:
        lane:
          - {label: GitHub Actions, strategy: gha}
          - {label: Upstream-style GHCR registry, strategy: registry}
          - {label: BoringCache layer, strategy: boringcache}
          - {label: BoringCache optimized, strategy: boringcache-optimized}
        architecture:
          - {name: amd64, platform: linux/amd64, runner: ubuntu-latest}
          - {name: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm}
        image_target: [dev, prod]
        repeat: [1, 2, 3]
    steps:
      - name: Checkout fork benchmark branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/base-images-cache-benchmark
        with:
          strategy: ${{ matrix.lane.strategy }}
          phase: seed
          source-sha: ${{ env.SEED_SOURCE_SHA }}
          architecture: ${{ matrix.architecture.name }}
          platform: ${{ matrix.architecture.platform }}
          target: ${{ matrix.image_target }}
          repetition: ${{ matrix.repeat }}

  rebuild:
    name: Rebuild trial ${{ matrix.repeat }} | ${{ matrix.lane.label }} | ${{ matrix.image_target }} | ${{ matrix.architecture.name }}
    if: ${{ always() && !contains(fromJSON('["cancelled", "skipped"]'), needs.seed.result) }}
    needs: seed
    runs-on: ${{ matrix.architecture.runner }}
    timeout-minutes: 180
    strategy: *benchmark-matrix
    steps:
      - name: Checkout fork benchmark branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/base-images-cache-benchmark
        with:
          strategy: ${{ matrix.lane.strategy }}
          phase: rebuild
          source-sha: ${{ env.REBUILD_SOURCE_SHA }}
          architecture: ${{ matrix.architecture.name }}
          platform: ${{ matrix.architecture.platform }}
          target: ${{ matrix.image_target }}
          repetition: ${{ matrix.repeat }}

  report:
    name: Comparison report
    if: ${{ always() && needs.rebuild.result != 'cancelled' }}
    needs: rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fork benchmark branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Download phase evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: phase-*
          path: phase-evidence
      - name: Summarize comparison
        run: >-
          python3 ./scripts/base-images-benchmark-report.py summarize
          --input-dir phase-evidence
          --expected-repetitions 3
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.2.0
        with:
          name: immich-base-images-cache-comparison
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
